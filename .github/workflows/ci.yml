name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ALLOWED_EMAIL_DOMAIN: aits.edu
          NEXT_PUBLIC_FIREBASE_API_KEY: mock-ci-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mock.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: mock-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: mock.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:mock
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://mock-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: mock-vapid


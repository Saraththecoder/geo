<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AITS College Bus Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      text-align: center;
      max-width: 400px;
      margin: 1rem;
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      color: #64748b;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      font-weight: 500;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.828m2.829 2.828L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.828m-4.243 4.243a9 9 0 01-2.829-2.828M3 3l18 18M9.879 9.879a3 3 0 004.242 4.242" />
    </svg>
    <h1>You are offline</h1>
    <p>You seem to have lost your internet connection. Previously loaded route data remains cached, but live GPS updates will resume once connected.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
